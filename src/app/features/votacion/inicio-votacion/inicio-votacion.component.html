<section class="inicio-votacion-page">
  <div class="page-shell">
    <div class="status-banner">
      <span class="icon">✔</span>
      <div>
        <p class="status-title">Tu voto es completamente anónimo.</p>
        <p class="status-copy">Nadie sabrá quién votaste.</p>
      </div>
    </div>

    <div class="content-panel">
      <div class="panel-heading">
        <h1>Votación Previa - Elige un candidato</h1>
      </div>

      <div class="search-row">
        <label class="sr-only" for="candidate-search">Buscar candidato</label>
        <input id="candidate-search" type="search" placeholder="Buscar por nombre o ciudad..." />
      </div>

      <div class="candidates-grid">
        <article class="candidate-card selected">
          <img class="candidate-avatar" src="https://i.pravatar.cc/88?img=32" alt="P. Juan Perez" />
          <div class="candidate-copy">
            <strong>P. Juan Perez</strong>
            <span>Párroco</span>
            <span>Quito</span>
          </div>
        </article>

        <article class="candidate-card">
          <img class="candidate-avatar" src="https://i.pravatar.cc/88?img=12" alt="P. Luis Gómez" />
          <div class="candidate-copy">
            <strong>P. Luis Gómez</strong>
            <span>Administrador</span>
            <span>Cuenca</span>
          </div>
        </article>

        <article class="candidate-card">
          <img
            class="candidate-avatar"
            src="https://i.pravatar.cc/88?img=24"
            alt="P. Carlos Torres"
          />
          <div class="candidate-copy">
            <strong>P. Carlos Torres</strong>
            <span>Capellán</span>
            <span>Guayaquil</span>
          </div>
        </article>

        <article class="candidate-card">
          <img
            class="candidate-avatar"
            src="https://i.pravatar.cc/88?img=16"
            alt="P. Andrés Ruiz"
          />
          <div class="candidate-copy">
            <strong>P. Andrés Ruiz</strong>
            <span>Vicario</span>
            <span>Quito</span>
          </div>
        </article>

        <article class="candidate-card">
          <img
            class="candidate-avatar"
            src="https://i.pravatar.cc/88?img=18"
            alt="P. Felipe Suárez"
          />
          <div class="candidate-copy">
            <strong>P. Felipe Suárez</strong>
            <span>Director</span>
            <span>Ambato</span>
          </div>
        </article>

        <article class="candidate-card">
          <img
            class="candidate-avatar"
            src="https://i.pravatar.cc/88?img=8"
            alt="P. Javier Medina"
          />
          <div class="candidate-copy">
            <strong>P. Javier Medina</strong>
            <span>Sacerdote</span>
            <span>Quito</span>
          </div>
        </article>
      </div>

      <div class="action-row">
        <button type="button" class="confirm-button">Confirmar mi voto</button>
      </div>
    </div>
  </div>
</section>
