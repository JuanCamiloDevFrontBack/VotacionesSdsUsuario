<section class="inicio-votacion-page">
  <div class="page-shell">
    <!-- Mensaje temporal 
    <div class="status-banner">
      <div>
        <p class="status-title">Tu voto es completamente anónimo.</p>
        <p class="status-copy">Nadie sabrá quién votaste.</p>
      </div>
    </div>
    -->
    <div class="content-panel">
      <div class="panel-heading">
        <h1>Votación Previa - Elige un candidato</h1>
      </div>

      <div class="search-row">
        <!--<label class="sr-only" for="candidate-search">Buscar candidato</label> -->
        <input id="candidate-search" type="search" placeholder="Buscar por nombre o ciudad..." />
      </div>

      <div class="candidates-grid">
        @for (candidate of candidates; track candidate.id) {
          <article
            class="candidate-card"
            [class.selected]="candidate.selected"
            (click)="selectCandidate(candidate.id)"
            role="button"
            tabindex="0"
          >
            <img class="candidate-avatar" [src]="candidate.avatar" [alt]="candidate.name" />
            <div class="candidate-copy">
              <strong>{{ candidate.name }}</strong>
              <span>{{ candidate.role }}</span>
              <span>{{ candidate.location }}</span>
            </div>
            @if (candidate.selected) {
              <span class="selected-badge">✔</span>
            }
          </article>
        } @empty {
          <p class="empty-message">No hay candidatos disponibles.</p>
        }
      </div>

      <div class="action-row">
        <button type="button" class="confirm-button" (click)="confirmVote()">
          Confirmar mi voto
        </button>
      </div>
    </div>
  </div>
</section>
