<div class="modal-overlay">
  <div class="modal-card">
    <section class="modal-header">
      <div>
        <p class="modal-eyebrow">Editar Sacerdote</p>
      </div>
      <button type="button" class="close-button" aria-label="Cerrar modal" (click)="close.emit()">×</button>
    </section>

    <div class="modal-grid">
      <div class="modal-column">
        <div class="modal-field">
          <label>Foto</label>
          <div class="avatar-plate">Foto</div>
        </div>
        <div class="modal-field">
          <label>Nombres</label>
          <input type="text" value="P. Juan Perez" readonly />
        </div>
        <div class="modal-field">
          <label>Apellidos</label>
          <input type="text" value="Gómez" readonly />
        </div>
        <div class="modal-field">
          <label>Edad</label>
          <input type="text" value="46" readonly />
        </div>
        <div class="modal-field">
          <label>Correo</label>
          <input type="email" value="juan.perez@sds.org" readonly />
        </div>
        <div class="modal-field">
          <label>Celular</label>
          <input type="tel" value="+593 9 8765 4321" readonly />
        </div>
      </div>

      <div class="modal-column">
        <div class="modal-field">
          <label>Fecha de ordenación</label>
          <input type="text" value="12/06/2010" readonly />
        </div>
        <div class="modal-field">
          <label>Fecha de votos perpetuos</label>
          <input type="text" value="24/03/2018" readonly />
        </div>
        <div class="modal-field">
          <label>Ciudad de misión</label>
          <input type="text" value="Quito" readonly />
        </div>
        <div class="modal-field">
          <label>Habilitado para votar</label>
          <div class="toggle-field">
            <span class="toggle-icon">🔒</span>
            <span>Activo</span>
          </div>
        </div>
        <div class="modal-field checkbox-field">
          <label>
            <input type="checkbox" checked disabled />
            Elegible para Provincial
          </label>
        </div>
      </div>
    </div>

    <footer class="modal-actions">
      <button type="button" class="secondary-button">Editar</button>
      <button type="button" class="primary-button">Guardar</button>
      <button type="button" class="text-button">Cancelar</button>
    </footer>
  </div>
</div>
