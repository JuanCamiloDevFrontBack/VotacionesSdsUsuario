<div class="modal-overlay">
  <div class="modal-card">
    <section class="modal-header">
      <div>
        <p class="modal-eyebrow">{{ isEditing ? 'Editar' : 'Crear' }} co-hermano</p>
      </div>
      <button type="button" class="close-button" aria-label="Cerrar modal" (click)="close.emit()">
        ×
      </button>
    </section>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="modal-grid">
        <div class="modal-column">
          <div class="modal-field">
            <label>Foto</label>
            <div class="avatar-plate">
              <label class="avatar-upload">
                <input type="file" accept="image/*" (change)="onPhotoSelected($event)" hidden />

                @if (photoPreview) {
                  <img [src]="photoPreview" alt="Foto seleccionada" />
                } @else {
                  <span class="upload-placeholder">Adjuntar foto</span>
                }
              </label>
            </div>
          </div>
          <div class="modal-field">
            <label>Nombres</label>
            <input pInputText type="text" formControlName="firstName" />
          </div>
          <div class="modal-field">
            <label>Apellidos</label>
            <input pInputText type="text" formControlName="lastName" />
          </div>
          <div class="modal-field">
            <label>Correo</label>
            <input pInputText type="email" formControlName="email" />
          </div>
          <div class="modal-field">
            <label>Celular</label>
            <input pInputText type="tel" formControlName="phone" />
          </div>
        </div>

        <div class="modal-column">
          <div class="modal-field">
            <label>Fecha de ordenación</label>
            <p-datepicker
              formControlName="ordinationDate"
              dateFormat="dd/mm/yy"
              mask="99/99/9999"
              placeholder="dd/mm/yyyy"
              showIcon="true"
              inputId="orderDate"
            ></p-datepicker>
          </div>
          <div class="modal-field">
            <label>Fecha de votos perpetuos</label>
            <p-datepicker
              formControlName="perpetualVowsDate"
              dateFormat="dd/mm/yy"
              mask="99/99/9999"
              placeholder="dd/mm/yyyy"
              showIcon="true"
              inputId="perpetualVowsDate"
              appendTo="body"
              [baseZIndex]="10000"
            ></p-datepicker>
          </div>
          <div class="modal-field">
            <label>Fecha de nacimiento</label>
            <p-datepicker
              formControlName="birthDate"
              dateFormat="dd/mm/yy"
              mask="99/99/9999"
              placeholder="dd/mm/yyyy"
              showIcon="true"
              inputId="birthDate"
              appendTo="body"
              [baseZIndex]="10000"
            ></p-datepicker>
          </div>
          <div class="modal-field">
            <label>Ciudad de misión</label>
            <input pInputText type="text" formControlName="missionCity" />
          </div>
          <div class="modal-field toggle-field-wrapper">
            <label>Habilitado para votar</label>
            <div class="toggle-field">
              <input type="checkbox" formControlName="enabledToVote" />
              <span>{{ form.get('enabledToVote')?.value ? 'Activo' : 'Inactivo' }}</span>
            </div>
          </div>
          <div class="modal-field checkbox-field">
            <label>
              <input type="checkbox" formControlName="eligibleForProvincial" />
              Elegible para Provincial
            </label>
          </div>
        </div>
      </div>

      <footer class="modal-actions">
        <button type="submit" class="save-button">
          {{ isEditing ? 'Guardar cambios' : 'Guardar' }}
        </button>
        <button type="button" class="cancel-button" (click)="close.emit()">Cancelar</button>
      </footer>
    </form>
  </div>
</div>
