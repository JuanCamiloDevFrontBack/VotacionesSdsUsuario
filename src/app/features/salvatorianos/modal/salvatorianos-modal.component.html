<div class="modal-overlay">
  <div class="modal-card">
    <section class="modal-header">
      <div>
        <p class="modal-eyebrow">{{ isEditing ? 'Editar' : 'Crear' }} co-hermano</p>
      </div>
      <button type="button" class="close-button" aria-label="Cerrar modal" (click)="close.emit()">
        ×
      </button>
    </section>

    <div class="modal-grid">
      <div class="modal-column">
        <div class="modal-field">
          <label>Foto</label>
          <div class="avatar-plate">
            <label class="avatar-upload">
              <input type="file" accept="image/*" (change)="onPhotoSelected($event)" hidden />

              @if (photoPreview) {
                <img [src]="photoPreview" alt="Foto seleccionada" />
              } @else {
                <span class="upload-placeholder">Adjuntar foto</span>
              }
            </label>
          </div>
        </div>
        <div class="modal-field">
          <label>Nombres</label>
          <input pInputText type="text" [(ngModel)]="firstName" />
        </div>
        <div class="modal-field">
          <label>Apellidos</label>
          <input pInputText type="text" [(ngModel)]="lastName" />
        </div>
        <div class="modal-field">
          <label>Correo</label>
          <input pInputText type="email" [(ngModel)]="email" />
        </div>
        <div class="modal-field">
          <label>Celular</label>
          <input pInputText type="tel" [(ngModel)]="phone" />
        </div>
      </div>

      <div class="modal-column">
        <div class="modal-field">
          <label>Fecha de ordenación</label>
          <p-datepicker
            [(ngModel)]="ordinationDate"
            dateFormat="dd/mm/yy"
            mask="99/99/9999"
            placeholder="dd/mm/yyyy"
            showIcon="true"
            inputId="orderDate"
          ></p-datepicker>
        </div>
        <div class="modal-field">
          <label>Fecha de votos perpetuos</label>
          <p-datepicker
            [(ngModel)]="perpetualVowsDate"
            dateFormat="dd/mm/yy"
            mask="99/99/9999"
            placeholder="dd/mm/yyyy"
            showIcon="true"
            inputId="perpetualVowsDate"
            appendTo="body"
            [baseZIndex]="10000"
          ></p-datepicker>
        </div>
        <div class="modal-field">
          <label>Fecha de nacimiento</label>
          <p-datepicker
            [(ngModel)]="birthDate"
            dateFormat="dd/mm/yy"
            mask="99/99/9999"
            placeholder="dd/mm/yyyy"
            showIcon="true"
            inputId="birthDate"
            appendTo="body"
            [baseZIndex]="10000"
          ></p-datepicker>
        </div>
        <div class="modal-field">
          <label>Ciudad de misión</label>
          <input pInputText type="text" [(ngModel)]="missionCity" />
        </div>
        <div class="modal-field toggle-field-wrapper">
          <label>Habilitado para votar</label>
          <div class="toggle-field">
            <input type="checkbox" [(ngModel)]="enabledToVote" />
            <span>{{ enabledToVote ? 'Activo' : 'Inactivo' }}</span>
          </div>
        </div>
        <div class="modal-field checkbox-field">
          <label>
            <input type="checkbox" [(ngModel)]="eligibleForProvincial" />
            Elegible para Provincial
          </label>
        </div>
      </div>
    </div>

    <footer class="modal-actions">
      <button type="button" class="save-button" (click)="onSubmit()">
        {{ isEditing ? 'Guardar cambios' : 'Guardar' }}
      </button>
      <button type="button" class="cancel-button" (click)="close.emit()">Cancelar</button>
    </footer>
  </div>
</div>
