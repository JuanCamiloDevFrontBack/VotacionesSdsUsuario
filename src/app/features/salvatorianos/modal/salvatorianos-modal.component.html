<div class="modal-overlay">
  <div class="modal-card">
    <section class="modal-header">
      <div>
        <p class="modal-eyebrow">Editar Sacerdote</p>
      </div>
      <button type="button" class="close-button" aria-label="Cerrar modal" (click)="close.emit()">
        ×
      </button>
    </section>

    <div class="modal-grid">
      <div class="modal-column">
        <div class="modal-field">
          <label>Foto</label>
          <div class="avatar-plate">
            <label class="avatar-upload">
              <input type="file" accept="image/*" (change)="onPhotoSelected($event)" hidden />

              @if (photoPreview) {
                <img [src]="photoPreview" alt="Foto seleccionada" />
              } @else {
                <span class="upload-placeholder">Adjuntar foto</span>
              }
            </label>
          </div>
        </div>
        <div class="modal-field">
          <label>Nombres</label>
          <input pInputText type="text" [(ngModel)]="name" readonly />
        </div>
        <div class="modal-field">
          <label>Apellidos</label>
          <input pInputText type="text" [(ngModel)]="surname" readonly />
        </div>
        <div class="modal-field">
          <label>Edad</label>
          <p-inputNumber [(ngModel)]="age" [min]="0" [mode]="'decimal'"></p-inputNumber>
        </div>
        <div class="modal-field">
          <label>Correo</label>
          <input pInputText type="email" [(ngModel)]="email" readonly />
        </div>
        <div class="modal-field">
          <label>Celular</label>
          <input pInputText type="tel" [(ngModel)]="phone" readonly />
        </div>
      </div>

      <div class="modal-column">
        <div class="modal-field">
          <label>Fecha de ordenación</label>
          <p-datepicker
            [(ngModel)]="orderDate"
            dateFormat="dd/mm/yy"
            mask="99/99/9999"
            placeholder="dd/mm/yyyy"
            showIcon="true"
            inputId="orderDate"
          ></p-datepicker>
        </div>
        <div class="modal-field">
          <label>Fecha de votos perpetuos</label>
          <p-datepicker
            [(ngModel)]="perpetualVowsDate"
            dateFormat="dd/mm/yy"
            mask="99/99/9999"
            placeholder="dd/mm/yyyy"
            showIcon="true"
            inputId="perpetualVowsDate"
            appendTo="body"
            [baseZIndex]="10000"
          ></p-datepicker>
        </div>
        <div class="modal-field">
          <label>Ciudad de misión</label>
          <input pInputText type="text" [(ngModel)]="city" readonly />
        </div>
        <div class="modal-field">
          <label>Habilitado para votar</label>
          <div class="toggle-field">
            <span class="toggle-icon">🔒</span>
            <span>Activo</span>
          </div>
        </div>
        <div class="modal-field checkbox-field">
          <label>
            <input type="checkbox" checked disabled />
            Elegible para Provincial
          </label>
        </div>
      </div>
    </div>

    <footer class="modal-actions">
      @if (true) {
        <button type="button" class="secondary-button">Guardar</button>
      } @else {
        <button type="button" class="primary-button">Editar</button>
      }
      <button type="button" class="text-button">Cancelar</button>
    </footer>
  </div>
</div>
