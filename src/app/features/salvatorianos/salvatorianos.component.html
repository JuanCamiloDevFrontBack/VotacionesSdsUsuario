<div class="salvatorianos-content">
  <header class="page-header">
    <div class="page-title">
      <h1>Gestión de Salvatorianos</h1>
    </div>
    <button type="button" class="primary-button">+ Nuevo Sacerdote</button>
  </header>

  <section class="list-card">
    <!--<div class="list-card-header">
      <h2>Votación Actual</h2>
    </div>-->

    <div class="table-scroll">
      <table class="data-table">
        <thead>
          <tr>
            <th class="row-color">Foto</th>
            <th class="row-color">Nombre</th>
            <th class="row-color">Cargo</th>
            <th class="row-color">Ciudad de Misión</th>
            <th class="row-color">Elegible</th>
            <th class="row-color">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (s of pagedItems; track s.id) {
            <tr>
              <td class="photo-cell">
                <img [src]="s.photo" [alt]="'Foto ' + s.name" />
              </td>
              <td>
                <strong>{{ s.name }}</strong>
                <span>{{ s.parish }}</span>
              </td>
              <td>{{ s.role }}</td>
              <td>{{ s.city }}</td>
              <td>
                @if (s.eligible) {
                  <span class="status-badge success">✔</span>
                }
              </td>
              <td>
                <button type="button" class="icon-button">Editar</button>
                <button type="button" class="icon-button danger">Eliminar</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <div class="paginator">
      <button (click)="setPage(1)" [disabled]="page === 1">«</button>
      <button (click)="prev()" [disabled]="page === 1">‹</button>

      @for (p of pagesArray(); track p) {
        <button (click)="setPage(p)" [class.active]="p === page">{{ p }}</button>
      }

      <button (click)="next()" [disabled]="page === totalPages">›</button>
      <button (click)="setPage(totalPages)" [disabled]="page === totalPages">»</button>

      <div class="page-size-select">
        <label>Mostrar</label>
        <select #size (change)="changePageSize(+size.value)">
          @for (s of pageSizes; track s) {
            <option [value]="s" [selected]="s === pageSize">{{ s }}</option>
          }
        </select>
      </div>
    </div>
  </section>

  <app-salvatorianos-modal class="hidden"></app-salvatorianos-modal>
</div>
